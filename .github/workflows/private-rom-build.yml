name: Private ROM build (manual opt-in)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Build profile
        type: choice
        options:
          - default
          - exact-reference
        default: default
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: source
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out template or personal source clone
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: source
          persist-credentials: false
      - name: Read root ROM source file
        id: rom_source
        run: python3 tools/rom_source.py --github-output "$GITHUB_OUTPUT"
      - name: Check out separate private ROM repository
        if: ${{ steps.rom_source.outputs.configured == 'true' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ steps.rom_source.outputs.repository }}
          ssh-key: ${{ secrets.PRIVATE_ROM_SSH_KEY }}
          path: private-roms
          persist-credentials: false
      - name: Install build tools
        if: ${{ steps.rom_source.outputs.configured == 'true' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang make binutils-arm-none-eabi
          python3 --version
      - name: Fetch pinned public Git dependencies
        if: ${{ steps.rom_source.outputs.configured == 'true' }}
        run: python3 tools/fetch_dependencies.py
      - name: Verify sources and run tests
        if: ${{ steps.rom_source.outputs.configured == 'true' }}
        run: |
          python3 tools/verify_vendor.py
          python3 -m unittest discover -s tests
      - name: Build from private hash-identified ROMs
        if: ${{ steps.rom_source.outputs.configured == 'true' }}
        env:
          BUILD_PROFILE: ${{ inputs.profile }}
        run: |
          python3 tools/ci_private_build.py \
            --rom-dir "$GITHUB_WORKSPACE/private-roms" \
            --work-dir "$RUNNER_TEMP/ffta-private" \
            --publish-dir "$RUNNER_TEMP/ffta-publish" \
            --profile "$BUILD_PROFILE"
      - name: Upload patch and hash report only
        if: ${{ steps.rom_source.outputs.configured == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ffta-us-cn-${{ inputs.profile }}
          path: |
            ${{ runner.temp }}/ffta-publish/ffta-us-cn.ips
            ${{ runner.temp }}/ffta-publish/build-report.json
          if-no-files-found: error
          retention-days: 7
      - name: Remove private inputs and build outputs
        if: ${{ always() }}
        working-directory: ${{ github.workspace }}
        run: rm -rf -- "$RUNNER_TEMP/ffta-private" "$RUNNER_TEMP/ffta-publish" "$GITHUB_WORKSPACE/private-roms"
